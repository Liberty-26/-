name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装后端依赖（含打包工具与识别 SDK）
        run: pip install -r requirements.txt pyinstaller yescan
        working-directory: backend

      - name: 打包内置后端
        run: pyinstaller --noconfirm --clean --name SteelDigitizeBackend --onedir --noconsole --collect-all uvicorn --collect-all fastapi --collect-all openpyxl --collect-all yescan --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on backend_entry.py
        working-directory: backend

      - name: 构建前端
        run: npm ci && npm run build
        working-directory: frontend

      - name: 准备 Electron 内置后端资源
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force electron/backend-dist/SteelDigitizeBackend | Out-Null
          Copy-Item -Recurse -Force backend/dist/SteelDigitizeBackend/* electron/backend-dist/SteelDigitizeBackend/

      - name: 打包 Windows 安装包（含桌面快捷方式）
        run: npm ci && npm run dist:win
        working-directory: electron

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: SteelDigitize-Pro-Setup
          path: electron/release/*.exe
          if-no-files-found: error
